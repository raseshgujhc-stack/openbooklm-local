services:
  stt-service:
    build: .
    network_mode: host
    volumes:
      # Mount local data directories
      - /home/ubuntu/openbooklm-local/data/stt-models:/app/models
      - /home/ubuntu/openbooklm-local/data/stt-uploads:/app/uploads
      - /home/ubuntu/openbooklm-local/data/stt-transcripts:/app/transcripts
      - /home/ubuntu/openbooklm-local/data/stt-logs:/app/logs
      # Mount legislation catalogs for data-driven legal normalization
      - /home/ubuntu/openbooklm-local/legal_act_sections_refined.csv:/app/legislation/legal_act_sections_refined.csv:ro
      - /home/ubuntu/openbooklm-local/structured_legislation_v4.csv:/app/legislation/structured_legislation_v4.csv:ro
      - /home/ubuntu/openbooklm-local/legal_asr_corrections.csv:/app/legislation/legal_asr_corrections.csv:ro
    environment:
      - MODEL_SIZE=${MODEL_SIZE:-small}
      - MAX_FILE_SIZE_MB=${MAX_FILE_SIZE_MB:-500}
      - CHUNK_DURATION_SECONDS=${CHUNK_DURATION_SECONDS:-300}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ENABLE_WEBSOCKET=${ENABLE_WEBSOCKET:-true}
      - PYTHONPATH=/app
      - WHISPER_MODEL_PATH=/app/models/whisper
      - WHISPER_BEAM_SIZE=${WHISPER_BEAM_SIZE:-1}
      - WHISPER_BEST_OF=${WHISPER_BEST_OF:-1}
      - WHISPER_NO_SPEECH_THRESHOLD=${WHISPER_NO_SPEECH_THRESHOLD:-0.45}
      - WHISPER_LOGPROB_THRESHOLD=${WHISPER_LOGPROB_THRESHOLD:--1.0}
      - WHISPER_COMPRESSION_RATIO_THRESHOLD=${WHISPER_COMPRESSION_RATIO_THRESHOLD:-2.4}
      - WHISPER_TEMPERATURES=${WHISPER_TEMPERATURES:-0.0,0.2}
      - LEGISLATION_CSV_PATH=/app/legislation/legal_act_sections_refined.csv
      - LEGAL_ASR_RULES_CSV=/app/legislation/legal_asr_corrections.csv
      - STT_FEEDBACK_DB_DSN=${STT_FEEDBACK_DB_DSN:-}
      - STT_FEEDBACK_TABLE=${STT_FEEDBACK_TABLE:-stt_user_feedback}
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          memory: 4G
          cpus: '2'
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; response = requests.get('http://localhost:8003/health', timeout=5); exit(0) if response.status_code == 200 else exit(1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
